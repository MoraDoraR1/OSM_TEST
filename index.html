<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7.77초 타이밍 게임</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game" class="screen state-idle">
    <div class="content">
      <h1>7.77초에 맞춰라</h1>
      <p id="message">클릭하면 타이머가 시작됩니다. 7.77초에 최대한 가깝게 다시 클릭해 멈추세요.</p>
      <p id="timerDisplay" class="hidden">0.000초</p>

      <div id="resultBox" class="hidden">
        <p id="resultTime"></p>
        <form id="nicknameForm">
          <input id="nicknameInput" maxlength="20" placeholder="닉네임" required />
          <button type="submit">기록 저장</button>
        </form>
        <p id="saveStatus"></p>
      </div>

      <div id="leaderboard" class="hidden">
        <h2>7.77초에 가장 가까운 기록 TOP 10</h2>
        <ol id="leaderboardList"></ol>
      </div>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>반응속도 측정</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game" class="screen state-idle">
    <div class="content">
      <h1>반응속도 측정</h1>
      <p id="message">화면을 클릭하면 시작합니다</p>

      <div id="resultBox" class="hidden">
        <p id="resultTime"></p>
        <form id="nicknameForm">
          <input id="nicknameInput" maxlength="20" placeholder="닉네임" required />
          <button type="submit">기록 저장</button>
        </form>
        <p id="saveStatus"></p>
      </div>

      <div id="leaderboard" class="hidden">
        <h2>최고 기록 TOP 10</h2>
        <ol id="leaderboardList"></ol>
      </div>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
